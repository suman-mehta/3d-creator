<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background-color: #030712;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
    }

    .banner-container {
      width: 1584px;
      height: 396px;
      position: relative;
      background-image: url('file:///home/suman-mehta/.gemini/antigravity-ide/brain/5ad63a75-0c08-4741-ab58-24b5401ee4d0/linkedin_banner_bg_1788760382203.jpg');
      background-size: cover;
      background-position: center right;
      display: flex;
      align-items: center;
    }

    /* Gradient overlay to ensure left text readability and deep contrast */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(3, 7, 18, 0.95) 0%,
        rgba(3, 7, 18, 0.88) 25%,
        rgba(3, 7, 18, 0.70) 45%,
        rgba(3, 7, 18, 0.25) 75%,
        rgba(3, 7, 18, 0.10) 100%
      );
    }

    /* Ambient lighting accents */
    .glow-cyan {
      position: absolute;
      top: -60px;
      left: 300px;
      width: 400px;
      height: 250px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.20) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    .glow-purple {
      position: absolute;
      bottom: -60px;
      left: 450px;
      width: 450px;
      height: 250px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    /* Content Layout - Offset from bottom-left to leave space for LinkedIn Circular Avatar */
    .content {
      position: relative;
      z-index: 10;
      margin-left: 320px; /* Leaves clear space for avatar on the left */
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 780px;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff;
    }

    .title-name {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .title-role {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .role-highlight {
      color: #f1f5f9;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .tags-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tag-cyan {
      border-color: rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
    }

    .tag-purple {
      border-color: rgba(192, 132, 252, 0.3);
      color: #d8b4fe;
    }

    .tag-amber {
      border-color: rgba(251, 191, 36, 0.3);
      color: #fde68a;
    }

    .footer-bar {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .domain-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      border-radius: 8px;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.35);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.12);
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .domain-box svg {
      width: 16px;
      height: 16px;
      stroke: #00f0ff;
    }

    .github-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="banner-container">
    <div class="overlay"></div>
    <div class="glow-cyan"></div>
    <div class="glow-purple"></div>

    <div class="content">
      <div class="badge-row">
        <div class="badge">
          <span class="badge-dot"></span>
          Creative Technologist
        </div>
        <div class="badge" style="border-color: rgba(168, 85, 247, 0.3); color: #c084fc;">
          <span class="badge-dot" style="background: #a855f7; box-shadow: 0 0 10px #a855f7;"></span>
          3D Motion Architecture
        </div>
      </div>

      <div class="title-name">
        Suman Mehta
      </div>

      <div class="title-role">
        <span class="role-highlight">3D Creator & Creative Technologist</span>
        <span style="color: #475569;">/</span>
        <span>Real-Time Visual Systems</span>
      </div>

      <div class="tags-row">
        <span class="tag tag-cyan">WebGL / WebGPU</span>
        <span class="tag tag-cyan">Three.js</span>
        <span class="tag tag-purple">GLSL Shaders</span>
        <span class="tag tag-purple">Motion Graphics</span>
        <span class="tag tag-amber">Interactive 3D Web</span>
      </div>

      <div class="footer-bar">
        <div class="domain-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          https://sumanmehta.in/
        </div>
        <div class="github-tag">
          github.com/suman-mehta
        </div>
      </div>
    </div>
  </div>
</body>
</html>
